name: test

on:
  # On push
  push:

  # On pull request
  pull_request:

  # Runs daily at UTC midnight.
  schedule:
    - cron: "0 0 * * *"

  # Allow manual activations.
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        vscode-version: ["1.125.0", "stable"]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash # Explicitly use Bash on all platforms

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: "package.json" # Detects from engines.node

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # Installs invoke and the other packages used by tasks.py.
      - name: Install Python requirements
        run: |
          pip install -r requirements.txt

      - name: Set up test environment
        run: |
          invoke setup

      - name: List directories
        run: |
          pwd
          ls -al
          ls -al .vscode-test
          ls -al .vscode-test/workspace

      # Runs lint and then the tests.
      - name: Run lint and tests
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            # On Ubuntu we need to run headless.
            xvfb-run -a invoke test --code-version ${{ matrix.vscode-version }}
          else
            invoke test --code-version ${{ matrix.vscode-version }}
          fi
