name: publish-to-vscode-marketplace

# From Grok:
#
# ──────────────────────────────────────────────────────────────
# PAT REQUIREMENTS (VSCE_PAT secret)
# ──────────────────────────────────────────────────────────────
# Must be created in Azure DevOps[](https://dev.azure.com)
# Required scope:
#   Custom defined → Marketplace → Manage
# Organization setting:
#   Prefer "All accessible organizations" (works reliably with any publisher)
#   "Specific organization" also works but may need re-creation if you change orgs
# This single PAT can publish ANY publisher owned by the same Microsoft account
# (no way to restrict it to just fpgawars — that’s by design)
# Recommended lifetime: 90–365 days, then rotate
# ──────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Apio IDE release tag, e.g. 2025-12-10"
        required: true
        type: string

env:
  # These env vars are set later.
  APIO_CLI_RELEASE_REPO: ""
  APIO_CLI_RELEASE_TAG: ""

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read # needed to download release assets

    steps:
      - name: Validate release tag format
        uses: fpgawars/apio-workflows/.github/actions/check-release-tag@main
        with:
          release-tag: ${{ inputs.release_tag }}

      - name: Check that the apio-vscode release is stable
        uses: fpgawars/apio-workflows/.github/actions/check-release-is-stable@main
        with:
          release-repo: ${{ github.repository }}
          release-tag: ${{ inputs.release_tag }}

      - name: Download .vsix from the selected release
        uses: robinraju/release-downloader@v1.10
        with:
          repository: ${{ github.repository }}
          tag: ${{ inputs.release_tag }}
          fileName: "*.vsix" # matches any .vsix in the release
          token: ${{ secrets.GITHUB_TOKEN }} # default token is enough

      - name: List files
        run: |
          ls -al

      - name: Extract the package.json file
        run: |
          unzip -p apio-vscode-????????.vsix extension/package.json > package.json
          cat -n package.json

      - name: List files
        run: |
          ls -al

      - name: Extract Apio CLI release info
        run: |
          repo=$(jq -r '.appConstants.apioCliReleaseRepo' package.json)
          echo "APIO_CLI_RELEASE_REPO=$repo"
          echo "APIO_CLI_RELEASE_REPO=$repo" >> "$GITHUB_ENV"

          tag=$(jq -r '.appConstants.apioCliReleaseTag' package.json)
          echo "APIO_CLI_RELEASE_TAG=$tag"
          echo "APIO_CLI_RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Check that the apio-cli release is stable
        uses: fpgawars/apio-workflows/.github/actions/check-release-is-stable@main
        with:
          release-repo: ${{ env.APIO_CLI_RELEASE_REPO }}
          release-tag: ${{ env.APIO_CLI_RELEASE_TAG }}

      - name: Install vsce
        run: |
          npm install -g @vscode/vsce

      - name: Publish fpgawars.apio to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VSIX_FILE=$(ls *.vsix | head -n1)
          echo "Publishing $VSIX_FILE ..."
          vsce publish --packagePath "$VSIX_FILE" -p "$VSCE_PAT"
